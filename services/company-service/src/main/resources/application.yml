spring:
  application:
    name: company-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/worksoft}
    username: ${DB_USERNAME:worksoft}
    password: ${DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    mapper:
      allow-coercion-of-scalars: false
server:
  port: ${SERVER_PORT:8081}
worksoft:
  cursor-secret: ${CURSOR_SECRET}
  security:
    issuer: ${OIDC_ISSUER:http://localhost:8080/realms/worksoft-local}
    jwk-set-uri: ${OIDC_JWKS:http://localhost:8080/realms/worksoft-local/protocol/openid-connect/certs}
    audience: company-service
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
